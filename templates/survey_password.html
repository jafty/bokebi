{% extends 'base.html' %}{% block content %}<section class="max-w-xl mx-auto"><div class="eyebrow">Sondage protégé</div><h1 class="text-3xl font-medium mb-4">{{ survey.team_name }}</h1><p class="text-gray-700 mb-8">Saisis le mot de passe communiqué par la personne qui a créé ce sondage.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="survey-password">Mot de passe</label><input type="password" name="survey_password" id="survey-password" required autofocus><button class="text-2xl cta-highlight mt-8">Accéder au sondage</button></form></section>{% endblock %}
