services:
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://${SURVEY_DB_USER:-bokebi}:${SURVEY_DB_PASSWORD:?Set SURVEY_DB_PASSWORD in .env}@db:5432/${SURVEY_DB_NAME:-bokebi}
      CONTACT_DATABASE_URL: postgresql://${CONTACT_DB_USER:-bokebi_contacts}:${CONTACT_DB_PASSWORD:?Set CONTACT_DB_PASSWORD in .env}@contacts-db:5432/${CONTACT_DB_NAME:-bokebi_contacts}
      CONTACT_NOTIFICATION_RECIPIENTS: ${CONTACT_NOTIFICATION_RECIPIENTS:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-contacts.email_backend.BrevoEmailBackend}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-25}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    depends_on:
      db: {condition: service_healthy}
      contacts-db: {condition: service_healthy}
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SURVEY_DB_NAME:-bokebi}
      POSTGRES_USER: ${SURVEY_DB_USER:-bokebi}
      POSTGRES_PASSWORD: ${SURVEY_DB_PASSWORD:?Set SURVEY_DB_PASSWORD in .env}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 3s, timeout: 3s, retries: 10}
    volumes: [survey-data:/var/lib/postgresql/data]
  contacts-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CONTACT_DB_NAME:-bokebi_contacts}
      POSTGRES_USER: ${CONTACT_DB_USER:-bokebi_contacts}
      POSTGRES_PASSWORD: ${CONTACT_DB_PASSWORD:?Set CONTACT_DB_PASSWORD in .env}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 3s, timeout: 3s, retries: 10}
    volumes: [contact-data:/var/lib/postgresql/data]
volumes: {survey-data: {}, contact-data: {}}
