{% extends 'base.html' %}{% block content %}<section class="content-narrow"><p class="eyebrow">Enquête protégée</p><h1>{{ survey.team_name }}</h1><p>Saisis le mot de passe communiqué par la personne qui a créé cette enquête.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<div class="form-group"><label for="survey-password">Mot de passe</label><input type="password" name="survey_password" id="survey-password" required autofocus></div><button class="primary-button">Accéder à l'enquête</button></form></section>{% endblock %}
