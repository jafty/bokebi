<div data-copy-group>
  <label for="poll-link">Lien du sondage</label>
  <div class="copy-row">
    <input type="url" id="poll-link" value="{{ poll_url }}" readonly>
    <button class="action" type="button" data-copy hidden>Copier le lien</button>
  </div>
  <p data-copy-status role="status"></p>
</div>
<a class="action mobile-share" href="{{ whatsapp_url }}" rel="noreferrer">Partager sur WhatsApp</a>
